<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniCake | Promoções</title>
    <meta name="description" content="Promoções e ofertas de doces, bolos e kits festa na UniCake." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600;700&family=Rouge+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/header.css" />
    <link rel="stylesheet" href="../assets/css/home.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/cards.css" />
    <link rel="stylesheet" href="../assets/css/cart.css" />
    <link rel="stylesheet" href="../assets/css/widgets.css" />
    <link rel="stylesheet" href="../assets/css/footer.css" />
    <link rel="stylesheet" href="../assets/css/accessibility.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <script defer src="../assets/js/data.js"></script>
    <script defer src="../assets/js/core.js"></script>
    <script defer src="../assets/js/header-footer.js"></script>
    <script defer src="../assets/js/cart.js"></script>
    <script defer src="../assets/js/support.js"></script>
    <script defer src="../assets/js/accessibility.js"></script>
    <script defer src="../assets/js/pages.js"></script>
    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script defer src="../assets/js/auth.js"></script>
  </head>
  <body data-page="promocoes">
    <div class="page-shell">
      <div id="site-header"></div>

      <main id="conteudo">
        <section class="page-hero">
          <div class="page-hero-inner">
            <div>
              <span class="eyebrow">Promoções</span>
              <h1>Ofertas para adoçar o dia.</h1>
              <p>Produtos selecionados com condições especiais para você testar o carrinho e finalizar pedidos.</p>
            </div>
            <aside class="hero-card">
              <strong>10%</strong>
              <p>Digite UNICAKE10 no cupom do carrinho.</p>
            </aside>
          </div>
        </section>

        <section class="content-section">
          <div class="section-head">
            <div class="section-title">
              <span class="section-kicker">Selecionadas</span>
              <h2>Promoções disponíveis</h2>
            </div>
          </div>
          <div class="promo-grid" id="promoGrid"></div>
        </section>
      </main>

      <div id="site-footer"></div>
    </div>
    <div id="site-cart"></div>

    <div id="site-accessibility"></div>
  </body>
</html>
