<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confeiteiro – Login</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/Loginconfeiteiro.css">
</head>
<body>

<div class="page-wrap">

  <!-- ══ ESQUERDA — Ilustração / Marca ══ -->
  <div class="left">

    <div class="brand-block">
      <p class="brand-tag">UniCake</p>
      <h1 class="brand-name">Confeiteiro</h1>
      <p class="brand-sub">Sua plataforma de receitas artesanais</p>
    </div>

    <div class="hero-area">
      <!-- Ilustração SVG inline: forminhas + batedor + espátula -->
      <svg viewBox="0 0 320 400" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Forminhas de bolo -->
        <ellipse cx="242" cy="88"  rx="34" ry="14" fill="#c8955a" opacity=".55"/>
        <path d="M208 88 Q208 128 242 130 Q276 128 276 88 Z" fill="#c8955a" opacity=".5"/>

        <ellipse cx="88"  cy="180" rx="36" ry="15" fill="#b07840"/>
        <path d="M52 180 Q52 224 88 226 Q124 224 124 180 Z" fill="#b07840" opacity=".88"/>

        <ellipse cx="232" cy="240" rx="38" ry="16" fill="#c8955a" opacity=".82"/>
        <path d="M194 240 Q194 286 232 288 Q270 286 270 240 Z" fill="#c8955a" opacity=".78"/>

        <ellipse cx="72"  cy="308" rx="40" ry="17" fill="#a06030"/>
        <path d="M32 308 Q32 358 72 360 Q112 358 112 308 Z" fill="#a06030" opacity=".9"/>

        <!-- Batedor (whisk) -->
        <rect x="148" y="196" width="15" height="172" rx="7.5" fill="#8a6040" transform="rotate(-20 148 196)"/>
        <rect x="148" y="234" width="26" height="11"  rx="5.5" fill="#6a4020" transform="rotate(-20 148 234)"/>
        <g stroke="#b8b8b8" stroke-width="2.8" fill="none" opacity=".88">
          <ellipse cx="168" cy="190" rx="22" ry="52" transform="rotate(-20 168 190)"/>
          <ellipse cx="184" cy="181" rx="16" ry="46" transform="rotate(-13 184 181)"/>
          <ellipse cx="152" cy="198" rx="16" ry="46" transform="rotate(-27 152 198)"/>
          <ellipse cx="168" cy="190" rx="10" ry="36" transform="rotate(-20 168 190)"/>
        </g>

        <!-- Espátula -->
        <rect x="52" y="60" width="10" height="110" rx="5"  fill="#9a7050" transform="rotate(12 52 60)"  opacity=".7"/>
        <rect x="46" y="56" width="22" height="38"  rx="6"  fill="#c8a060" transform="rotate(12 46 56)"  opacity=".65"/>
      </svg>
    </div>

    <div class="hero-tagline">
      <div class="dot-row">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <p>Acesse sua conta para gerenciar<br>receitas, pedidos e muito mais.</p>
    </div>

  </div><!-- /left -->

  <!-- ══ DIREITA — Formulário de login ══ -->
  <div class="right">

    <div class="form-header">
      <p class="form-eyebrow">Bem-vindo de volta</p>
      <h2 class="form-title">Fazer Login</h2>
      <div class="title-divider">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- Campo: E-mail -->
    <div class="field" id="field-email">
      <label class="field-label" for="email">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4a2e10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M2 7l10 7 10-7"/>
        </svg>
        E-mail <span class="req" aria-label="obrigatório">*</span>
      </label>
      <div class="input-wrap">
        <input
          id="email"
          type="email"
          placeholder="seu@email.com"
          autocomplete="email"
        />
      </div>
      <span class="field-error-msg" role="alert">Insira um e-mail válido.</span>
    </div>

    <!-- Campo: Senha -->
    <div class="field" id="field-senha">
      <label class="field-label" for="senha">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4a2e10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Senha <span class="req" aria-label="obrigatório">*</span>
      </label>
      <div class="input-wrap">
        <input
          id="senha"
          type="password"
          placeholder="Mínimo 6 caracteres"
          autocomplete="current-password"
          style="padding-right: 3rem"
        />
        <button class="toggle-pw" type="button" id="togglePw" aria-label="Mostrar senha">
          <!-- Olho aberto -->
          <svg id="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- Olho fechado (oculto por padrão) -->
          <svg id="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
      <span class="field-error-msg" role="alert">A senha deve ter pelo menos 6 caracteres.</span>
    </div>

    <!-- Lembrar-me + Esqueceu a senha -->
    <div class="extras">
      <label class="checkbox-wrap">
        <input type="checkbox" id="remember" checked/>
        <span class="custom-check" aria-hidden="true">
          <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
            <path d="M1 5L4.5 8.5L11 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="cb-label">Lembrar-me</span>
      </label>
      <a class="forgot" id="forgotLink" role="button" tabindex="0">Esqueceu a senha?</a>
    </div>

    <!-- Botão entrar -->
    <button class="btn-submit" id="btnEntrar" type="button">
      <span class="btn-label">Entrar</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>

    <!-- Cadastro -->
    <div class="register">
      <p>Não tem uma conta? <a href="../html/Cadastroconfeiteiro.html">Cadastre-se</a></p>
    </div>

  </div><!-- /right -->
</div><!-- /page-wrap -->

<!-- Toast de notificação -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Script -->
<script src="../js/Loginconfeiteiro.js"></script>
</body>
</html>
