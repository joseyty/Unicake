<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniCake</title>
    <link rel="stylesheet" href="../css/PaginaInicial.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo"><img src="" alt="UniCake"></div>

        <div class="search">
            <input type="text" placeholder="Busque por item ou loja">
        </div>

        <nav class="menu">
            <a href="#">Sobre</a>
            <a href="#">Para você</a>
            <a href="#">Para empresas</a>
            <a href="#">Lojas Cadastradas</a>
        </nav>

        <div class="actions">
            <button class="btn-outline">Entrar</button>
            <button class="btn-solid">Cadastrar</button>
            <div class="cart">🛒 0</div>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">

        <h1 class="watermark">UniCake</h1>

        <div class="cake-container">
            <img src="../img/fatia-bolo-png-removebg-preview.png" alt="Bolo de Chocolate">
        </div>

    </section>

    <!-- CATEGORIAS -->
    <section class="categories">
        <a href="#">Categorias ▾</a>
        <a href="#">Bolos ▾</a>
        <a href="#">Cupcakes ▾</a>
        <a href="#">Tortas ▾</a>
        <a href="#">Doces Gourmet ▾</a>
        <a href="#">Cookies & Brownies ▾</a>
        <a href="#">Kits Festa ▾</a>
        <a href="#">Bolos Personalizados ▾</a>
    </section>


    <div class="container">
        <div class="card">
        
         

        </div>
            
    </div>
</body>
</html>
