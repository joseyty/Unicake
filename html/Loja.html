<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniCake | Loja</title>
    <link rel="icon" type="image/png" href="../assets/img/logo-bolo.png" />
    <meta name="description" content="Produtos em destaque e promoções da loja na UniCake." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600;700&family=Rouge+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/header.css" />
    <link rel="stylesheet" href="../assets/css/home.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/cards.css" />
    <link rel="stylesheet" href="../assets/css/cart.css" />
    <link rel="stylesheet" href="../assets/css/widgets.css" />
    <link rel="stylesheet" href="../assets/css/footer.css" />
    <link rel="stylesheet" href="../assets/css/accessibility.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <script defer src="../assets/js/data.js"></script>
    <script defer src="../assets/js/core.js"></script>
    <script defer src="../assets/js/header-footer.js"></script>
    <script defer src="../assets/js/cart.js"></script>
    <script defer src="../assets/js/accessibility.js"></script>
    <script defer src="../assets/js/pages.js"></script>
    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script defer src="../assets/js/auth.js"></script>
    <link rel="stylesheet" href="../assets/css/chat-assistant.css" />
    <script defer src="../assets/js/chat-assistant.js"></script>
  </head>
  <body data-page="lojas">
    <div class="page-shell">
      <div id="site-header"></div>

      <main id="conteudo">
        <section class="page-hero">
          <div class="page-hero-inner" id="storeHero"></div>
        </section>

        <section class="content-section" id="storeFeaturedSection">
          <div class="section-head">
            <div class="section-title">
              <span class="section-kicker">Os mais pedidos</span>
              <h2>Produtos em destaque</h2>
              <p>Os produtos mais procurados desta loja.</p>
            </div>
            <a class="section-link" id="storeAllProducts" href="ParaVoce.html">Ver todos os produtos</a>
          </div>
          <div class="product-grid" id="storeFeatured"></div>
        </section>

        <section class="content-section" id="storePromosSection">
          <div class="section-head">
            <div class="section-title">
              <span class="section-kicker">Ofertas</span>
              <h2>Promoções da loja</h2>
              <p>Produtos desta loja com oferta ativa.</p>
            </div>
            <a class="section-link" href="promocoes.html">Ver todas as promoções</a>
          </div>
          <div class="promo-grid" id="storePromos"></div>
        </section>
      </main>

      <div id="site-footer"></div>
    </div>
    <div id="site-cart"></div>

    <div id="site-accessibility"></div>
  </body>
</html>
