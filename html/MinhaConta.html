<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniCake | Minha conta</title>
    <link rel="icon" type="image/png" href="../assets/img/logo-bolo.png" />
    <meta name="description" content="Veja os dados da sua conta UniCake ou exclua seu cadastro." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600;700&family=Rouge+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/header.css" />
    <link rel="stylesheet" href="../assets/css/home.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/cards.css" />
    <link rel="stylesheet" href="../assets/css/cart.css" />
    <link rel="stylesheet" href="../assets/css/widgets.css" />
    <link rel="stylesheet" href="../assets/css/footer.css" />
    <link rel="stylesheet" href="../assets/css/accessibility.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <script defer src="../assets/js/data.js"></script>
    <script defer src="../assets/js/core.js"></script>
    <script defer src="../assets/js/auth.js"></script>
    <script defer src="../assets/js/header-footer.js"></script>
    <script defer src="../assets/js/cart.js"></script>
    <script defer src="../assets/js/accessibility.js"></script>
    <script defer src="../assets/js/pages.js"></script>
    <script defer src="../assets/js/conta.js"></script>
  </head>
  <body data-page="minha-conta">
    <div class="page-shell">
      <div id="site-header"></div>

      <main id="conteudo" class="auth-layout">
        <section class="login-card" id="contaCard" aria-labelledby="conta-title">
          <span class="eyebrow">Conta UniCake</span>
          <h1 id="conta-title">Minha conta</h1>
          <p class="form-status" id="contaStatus" role="status">Carregando sua conta...</p>
          <div id="contaConteudo" hidden>
            <dl class="confeiteiro-dados">
              <div><dt>Nome</dt><dd data-conta="nome"></dd></div>
              <div><dt>E-mail</dt><dd data-conta="email"></dd></div>
              <div><dt>Forma de login</dt><dd data-conta="login"></dd></div>
              <div><dt>Cliente desde</dt><dd data-conta="data_cadastro"></dd></div>
            </dl>
            <div class="confeiteiro-acoes">
              <a class="btn-secondary" href="ParaVoce.html">Ver produtos</a>
              <button type="button" class="logout-button" id="contaSair">Sair</button>
            </div>
            <details class="excluir-conta">
              <summary>Excluir minha conta</summary>
              <p>Apaga seu cadastro e seus dados pessoais. Não dá para desfazer.</p>
              <form id="excluirContaForm">
                <label>
                  Confirme sua senha
                  <input type="password" name="senha" autocomplete="current-password" maxlength="200" placeholder="Digite sua senha" required />
                </label>
                <button type="submit" class="botao-perigo">Excluir conta definitivamente</button>
              </form>
              <p class="form-status" id="excluirContaStatus" role="status"></p>
            </details>
          </div>
        </section>
      </main>

      <div id="site-footer"></div>
    </div>
    <div id="site-cart"></div>
    <div id="site-accessibility"></div>
  </body>
</html>
