<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esqueci a Senha</title>
  <link rel="stylesheet" href="../css/EsqueciSenha.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

</head>

<body>

  
  <span class="deco deco-1" aria-hidden="true">🍩</span>
  <span class="deco deco-2" aria-hidden="true">☕</span>
  <span class="deco deco-3" aria-hidden="true">🧁</span>
  <span class="deco deco-4" aria-hidden="true">🍪</span>
  <span class="deco deco-5" aria-hidden="true">🍫</span>
  <span class="deco deco-6" aria-hidden="true">🥐</span>
  <span class="star star-1" aria-hidden="true">✦</span>
  <span class="star star-2" aria-hidden="true">✦</span>
  <span class="star star-3" aria-hidden="true">✦</span>
  <span class="star star-4" aria-hidden="true">✦</span>
  <span class="star star-5" aria-hidden="true">✦</span>

  <div class="card">

    <div class="card__emoji">🔑</div>
    <h1 class="card__title">Esqueci a senha</h1>
    <p class="card__subtitle" id="card-subtitle">
      Sem problema! Vamos te ajudar<br>a recuperar seu acesso 
    </p>

    <div class="steps" aria-label="Etapas">
      <div class="step">
        <div class="step__dot active" id="dot-1">1</div>
        <span class="step__label active" id="lbl-1">E-mail</span>
      </div>
      <div class="step__line" id="line-1"></div>
      <div class="step">
        <div class="step__dot" id="dot-2">2</div>
        <span class="step__label" id="lbl-2">Código</span>
      </div>
      <div class="step__line" id="line-2"></div>
      <div class="step">
        <div class="step__dot" id="dot-3">3</div>
        <span class="step__label" id="lbl-3">Nova senha</span>
      </div>
    </div>

    <div class="step-panel active" id="panel-1">
      <div class="field">
        <label class="field__label" for="input-email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          E-mail cadastrado
        </label>
        <input id="input-email" class="field__input" type="email"
               placeholder="Digite seu e-mail" autocomplete="email" />
        <p class="field__hint">Enviaremos um código de 6 dígitos para este e-mail.</p>
      </div>
      <button class="btn-primary" id="btn-step1">Enviar código</button>
    </div>

    
    <div class="step-panel" id="panel-2">
      <div class="otp-row" id="otp-row" aria-label="Código de verificação">
        <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 1" />
        <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 2" />
        <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 3" />
        <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 4" />
        <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 5" />
        <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 6" />
      </div>

      <div class="resend-row">
        <span class="resend-text">Não recebeu? </span>
        <button class="resend-btn" id="resend-btn" disabled>Reenviar (<span id="timer">30</span>s)</button>
      </div>

      <button class="btn-primary" id="btn-step2">Verificar código</button>
    </div>

    
    <div class="step-panel" id="panel-3">
      <div class="field">
        <label class="field__label" for="input-nova-senha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Nova senha
        </label>
        <div class="field__input-wrapper">
          <input id="input-nova-senha" class="field__input field__input--has-toggle"
                 type="password" placeholder="Digite sua nova senha" autocomplete="new-password" />
          <button class="field__toggle-btn" type="button" aria-label="Mostrar senha" id="toggle-nova"></button>
        </div>
        <div class="strength-bar" id="strength-bar" aria-hidden="true">
          <div class="strength-bar__seg" id="seg1"></div>
          <div class="strength-bar__seg" id="seg2"></div>
          <div class="strength-bar__seg" id="seg3"></div>
          <div class="strength-bar__seg" id="seg4"></div>
        </div>
        <p class="strength-label" id="strength-label"></p>
      </div>

      <div class="field">
        <label class="field__label" for="input-confirmar-senha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            <path d="m9 16 2 2 4-4"/>
          </svg>
          Confirmar nova senha
        </label>
        <div class="field__input-wrapper">
          <input id="input-confirmar-senha" class="field__input field__input--has-toggle"
                 type="password" placeholder="Confirme sua nova senha" autocomplete="new-password" />
          <button class="field__toggle-btn" type="button" aria-label="Mostrar senha" id="toggle-confirmar"></button>
        </div>
      </div>

      <button class="btn-primary" id="btn-step3">Redefinir senha</button>
    </div>

    <p class="footer"><a href="Entrar.html">← Voltar para o login</a></p>

  </div>

</body>
</html>
