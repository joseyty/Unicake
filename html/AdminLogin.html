<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - UniCake</title>
  <link rel="stylesheet" href="../css/AdminLogin.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <h1>Admin</h1>
        <p>UniCake - Painel Administrativo</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="admin@unicake.com" required>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">Entrar</button>
      </form>

      <form id="twoFactorForm" class="login-form hidden">
        <div class="form-group">
          <label for="twoFactorCode">Código 2FA</label>
          <input type="text" id="twoFactorCode" placeholder="000000" maxlength="6" required>
          <small>Digite o código do seu aplicativo autenticador</small>
        </div>

        <button type="submit" class="btn-login" id="verifyBtn">Verificar</button>
        <button type="button" class="btn-secondary" id="backBtn">Voltar</button>
      </form>

      <div class="login-footer">
        <p>Acesso restrito a administradores autorizados</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="../js/AdminLogin.js"></script>
</body>
</html>
