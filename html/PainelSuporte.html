<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniCake | Painel de suporte</title>
    <link rel="icon" type="image/png" href="../assets/img/logo-bolo.png" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Painel da equipe UniCake para responder chamados de suporte." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600;700&family=Rouge+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/header.css" />
    <link rel="stylesheet" href="../assets/css/home.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/cards.css" />
    <link rel="stylesheet" href="../assets/css/cart.css" />
    <link rel="stylesheet" href="../assets/css/widgets.css" />
    <link rel="stylesheet" href="../assets/css/footer.css" />
    <link rel="stylesheet" href="../assets/css/accessibility.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <script defer src="../assets/js/data.js"></script>
    <script defer src="../assets/js/core.js"></script>
    <script defer src="../assets/js/auth.js"></script>
    <script defer src="../assets/js/header-footer.js"></script>
    <script defer src="../assets/js/cart.js"></script>
    <script defer src="../assets/js/accessibility.js"></script>
    <script defer src="../assets/js/pages.js"></script>
    <script defer src="../assets/js/chamados.js"></script>
    <script defer src="../assets/js/painel-chamados.js"></script>
  </head>
  <body data-page="painel-suporte">
    <div class="page-shell">
      <div id="site-header"></div>

      <main id="conteudo" class="auth-layout">
        <section class="login-card painel-chamados" aria-labelledby="painel-suporte-title">
          <span class="eyebrow">Equipe UniCake</span>
          <h1 id="painel-suporte-title">Painel de suporte</h1>
          <p>Feedbacks, reclamações, bugs e dúvidas enviados pela página Suporte. A resposta aparece para o cliente em "Minha conta".</p>
          <div id="painelChamados" hidden>
            <div class="chamados-filtros">
              <label>
                Assunto
                <select id="filtroTipo"><option value="">Todos</option></select>
              </label>
              <label>
                Situação
                <select id="filtroStatus"><option value="">Todas</option></select>
              </label>
            </div>
          </div>
          <p class="form-status" id="painelChamadosStatus" role="status">Carregando chamados...</p>
          <div class="chamados-lista" id="chamadosLista"></div>
        </section>
      </main>

      <div id="site-footer"></div>
    </div>
    <div id="site-cart"></div>
    <div id="site-accessibility"></div>
  </body>
</html>
