<!-- Chat Flutuante de Suporte -->
<div id="chatWidget" class="chat-widget">
  <!-- Ícone do Chat (botão flutuante) -->
  <button id="chatToggleBtn" class="chat-toggle-btn" title="Abrir Chat de Suporte">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  </button>

  <!-- Modal do Chat -->
  <div id="chatModal" class="chat-modal">
    <!-- Header do Chat -->
    <div class="chat-header">
      <div class="chat-header-content">
        <h2>Suporte UniCake</h2>
        <p class="chat-status">🟢 Online - Atendimento 24h</p>
      </div>
      <button id="chatCloseBtn" class="chat-close-btn" title="Fechar Chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Área de Mensagens -->
    <div id="chatMessages" class="chat-messages">
      <div class="chat-message bot-message">
        <p>Olá! 👋 Bem-vindo à UniCake!</p>
        <span class="message-time">Agora</span>
      </div>
      <div class="chat-message bot-message">
        <p>Estou aqui para ajudar com suas dúvidas sobre pedidos, produtos, entregas e muito mais! 😊</p>
        <span class="message-time">Agora</span>
      </div>
      <div class="chat-message bot-message">
        <p>Clique em uma das opções abaixo ou me escreva uma mensagem:</p>
        <span class="message-time">Agora</span>
      </div>
    </div>

    <!-- Opções Rápidas -->
    <div class="chat-quick-options">
      <button class="quick-option" onclick="sendMessage('Tire minhas dúvidas sobre um pedido')">📦 Meu Pedido</button>
      <button class="quick-option" onclick="sendMessage('Quero falar sobre um produto')">🍰 Produtos</button>
      <button class="quick-option" onclick="sendMessage('Tenho uma reclamação')">⚠️ Reclamação</button>
      <button class="quick-option" onclick="sendMessage('Preciso de outro assunto')">💬 Outro</button>
    </div>

    <!-- Campo de Entrada -->
    <div class="chat-input-area">
      <input 
        type="text" 
        id="chatInput" 
        class="chat-input" 
        placeholder="Digite sua mensagem..."
        onkeypress="handleInputKeypress(event)"
      />
      <button id="chatSendBtn" class="chat-send-btn" title="Enviar Mensagem">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>
