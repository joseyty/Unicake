<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniCake | Entrar</title>
    <meta name="description" content="Acesse sua conta UniCake." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600;700&family=Rouge+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/header.css" />
    <link rel="stylesheet" href="../assets/css/home.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/cards.css" />
    <link rel="stylesheet" href="../assets/css/cart.css" />
    <link rel="stylesheet" href="../assets/css/widgets.css" />
    <link rel="stylesheet" href="../assets/css/footer.css" />
    <link rel="stylesheet" href="../assets/css/accessibility.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <script defer src="../assets/js/data.js"></script>
    <script defer src="../assets/js/core.js"></script>
    <script defer src="../assets/js/header-footer.js"></script>
    <script defer src="../assets/js/cart.js"></script>
    <script defer src="../assets/js/support.js"></script>
    <script defer src="../assets/js/accessibility.js"></script>
    <script defer src="../assets/js/pages.js"></script>
    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script defer src="../assets/js/auth.js"></script>
  </head>
  <body data-page="entrar">
    <div class="page-shell">
      <div id="site-header"></div>

      <main id="conteudo" class="auth-layout">
        <section class="login-card" aria-labelledby="login-title">
          <span class="eyebrow">Conta UniCake</span>
          <h1 id="login-title">Entrar</h1>
          <p>Acesse sua conta para acompanhar pedidos, salvar lojas e revisar compras.</p>
          <form id="loginForm">
            <label>
              E-mail
              <input type="email" name="email" autocomplete="email" placeholder="voce@email.com" required />
            </label>
            <label>
              Senha
              <input type="password" name="password" autocomplete="current-password" placeholder="Digite sua senha" required />
            </label>
            <button type="submit">Entrar</button>
          </form>
          <button class="google-button" type="button">Entrar com Google</button>
          <p class="form-status" id="loginStatus" role="status"></p>
          <p class="register">Ainda não tem conta? <a href="Suporte.html">Peça ajuda no suporte</a></p>
        </section>
      </main>

      <div id="site-footer"></div>
    </div>
    <div id="site-cart"></div>
    <div id="site-accessibility"></div>
  </body>
</html>
