<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso de Suporte - UniCake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600;700&family=Rouge+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-body);
        background: linear-gradient(135deg, var(--brown-dark), var(--brown));
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--brown-dark);
      }

      .login-container {
        width: min(100%, 380px);
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(47, 27, 19, 0.3);
        padding: 2.5rem 1.5rem;
        animation: slideDown 0.4s ease;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .login-icon {
        width: 3.5rem;
        height: 3.5rem;
        background: linear-gradient(135deg, var(--rose), #f3c7d2);
        border-radius: 50%;
        display: grid;
        place-items: center;
        margin: 0 auto 1rem;
        font-size: 1.8rem;
      }

      .login-header h1 {
        font-size: 1.5rem;
        font-family: var(--font-round);
        color: var(--brown-dark);
        margin-bottom: 0.35rem;
      }

      .login-header p {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .login-form {
        display: grid;
        gap: 1.2rem;
      }

      .form-group {
        display: grid;
        gap: 0.4rem;
      }

      .form-group label {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--brown-dark);
      }

      .form-group input {
        padding: 0.85rem 1rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.2s ease;
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--rose);
        box-shadow: 0 0 0 3px rgba(224, 123, 154, 0.1);
      }

      .form-group input::placeholder {
        color: #999;
      }

      .submit-button {
        padding: 1rem;
        background: linear-gradient(135deg, var(--rose), #f0a6be);
        color: white;
        border: 0;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 0.5rem;
      }

      .submit-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(224, 123, 154, 0.3);
      }

      .submit-button:active {
        transform: translateY(0);
      }

      .submit-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .error-message {
        padding: 0.85rem 1rem;
        background: #f8d7da;
        color: #721c24;
        border-radius: 6px;
        font-size: 0.9rem;
        display: none;
        animation: shake 0.3s ease;
      }

      .error-message.show {
        display: block;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }

      .success-message {
        padding: 0.85rem 1rem;
        background: #d4edda;
        color: #155724;
        border-radius: 6px;
        font-size: 0.9rem;
        display: none;
        animation: fadeIn 0.3s ease;
      }

      .success-message.show {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .loading-spinner {
        display: none;
        width: 1rem;
        height: 1rem;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-spinner.show {
        display: block;
      }

      .back-link {
        text-align: center;
        margin-top: 1.5rem;
      }

      .back-link a {
        color: var(--rose);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        transition: color 0.2s ease;
      }

      .back-link a:hover {
        color: #d97d99;
      }

      .security-info {
        margin-top: 1.5rem;
        padding: 1rem;
        background: #f0f8ff;
        border-radius: 6px;
        font-size: 0.8rem;
        color: var(--brown-soft);
        border-left: 3px solid var(--rose);
      }

      .security-info strong {
        color: var(--brown-dark);
      }
    </style>
</head>
<body>
    <div class="login-container">
      <div class="login-header">
        <div class="login-icon">🔐</div>
        <h1>Acesso de Suporte</h1>
        <p>Painel exclusivo para atendimento</p>
      </div>

      <form class="login-form" id="loginForm">
        <div id="successMessage" class="success-message"></div>
        <div id="errorMessage" class="error-message"></div>

        <div class="form-group">
          <label for="email">E-mail de Suporte</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="submit-button" id="submitBtn">
          <span id="buttonText">Entrar</span>
          <div id="spinner" class="loading-spinner"></div>
        </button>
      </form>

      <div class="security-info">
        <strong>🔒 Informações Seguras:</strong>
        <p>Suas credenciais são salvas com segurança. A sessão expira em 8 horas de inatividade.</p>
      </div>

      <div class="back-link">
        <a href="index.html">← Voltar para UniCake</a>
      </div>
    </div>

    <script src="../assets/js/support-auth.js"></script>
    <script>
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const submitBtn = document.getElementById("submitBtn");
      const errorMsg = document.getElementById("errorMessage");
      const successMsg = document.getElementById("successMessage");
      const buttonText = document.getElementById("buttonText");
      const spinner = document.getElementById("spinner");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        const senha = passwordInput.value;

        // Limpar mensagens
        errorMsg.classList.remove("show");
        successMsg.classList.remove("show");

        // Mostrar loading
        submitBtn.disabled = true;
        buttonText.textContent = "Verificando...";
        spinner.classList.add("show");

        // Simular delay de validação
        setTimeout(() => {
          const loginSucesso = window.UniCakeSupportAuth.login(email, senha);

          if (loginSucesso) {
            successMsg.textContent = "✅ Login realizado com sucesso! Redirecionando...";
            successMsg.classList.add("show");

            setTimeout(() => {
              window.location.href = "painel-suporte.html";
            }, 1500);
          } else {
            errorMsg.textContent = "❌ E-mail ou senha incorretos. Tente novamente.";
            errorMsg.classList.add("show");

            submitBtn.disabled = false;
            buttonText.textContent = "Entrar";
            spinner.classList.remove("show");

            // Focar no campo de email
            emailInput.focus();
            emailInput.select();
          }
        }, 800);
      });

      // Focar no email ao carregar
      emailInput.focus();
    </script>
</body>
</html>
