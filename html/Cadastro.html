<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro</title>
  <link rel="stylesheet" href="/css/Cadastro.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
</head>

<body>

 
  <span class="deco deco-1" aria-hidden="true">🍩</span>
  <span class="deco deco-2" aria-hidden="true">☕</span>
  <span class="deco deco-3" aria-hidden="true">🧁</span>
  <span class="deco deco-4" aria-hidden="true">🍪</span>
  <span class="deco deco-5" aria-hidden="true">🍫</span>
  <span class="deco deco-6" aria-hidden="true">🥐</span>
  <span class="star star-1" aria-hidden="true">✦</span>
  <span class="star star-2" aria-hidden="true">✦</span>
  <span class="star star-3" aria-hidden="true">✦</span>
  <span class="star star-4" aria-hidden="true">✦</span>
  <span class="star star-5" aria-hidden="true">✦</span>

 
  <div class="card">

    <h1 class="card__title">Cadastro</h1>
    <p class="card__subtitle">
      Crie sua conta e aproveite nossos<br>deliciosos produtos 
    </p>

    
    <div class="field">
      <label class="field__label" for="input-nome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Nome
      </label>
      <input id="input-nome" class="field__input" type="text" placeholder="Digite seu nome" autocomplete="name" />
    </div>

    
    <div class="field">
      <label class="field__label" for="input-email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
        E-mail
      </label>
      <input id="input-email" class="field__input" type="email" placeholder="Digite seu e-mail" autocomplete="email" />
    </div>

  
    <div class="field">
      <label class="field__label" for="input-senha">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Senha
      </label>
      <input id="input-senha" class="field__input" type="password" placeholder="Digite sua senha" autocomplete="new-password" />
    </div>

    
    <div class="field">
      <label class="field__label" for="input-confirmar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          <path d="m9 16 2 2 4-4"/>
        </svg>
        Confirmar senha
      </label>
      <input id="input-confirmar" class="field__input" type="password" placeholder="Confirme sua senha" autocomplete="new-password" />
    </div>

   
    <div class="terms">
      <input class="terms__checkbox" type="checkbox" id="terms" checked />
      <label class="terms__label" for="terms">
        Aceito os <a href="#">termos de uso</a>
      </label>
    </div>

  
    <button class="btn-primary">Cadastrar</button>

 
    <div class="divider" aria-hidden="true">
      <div class="divider__line"></div>
      <span class="divider__text">Ou cadastre-se com</span>
      <div class="divider__line"></div>
    </div>

  
    <div class="social">

     
      <button class="social__btn" aria-label="Entrar com Apple">
        <svg viewBox="0 0 24 24" fill="#3d2210">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
      </button>

      
      <button class="social__btn" aria-label="Entrar com Google">
        <svg viewBox="0 0 24 24">
          <path fill="#EA4335" d="M5.27 9.76A7.08 7.08 0 0 1 12 4.9c1.69 0 3.22.6 4.41 1.59l3.3-3.3A11.95 11.95 0 0 0 12 1C8.24 1 4.98 3.01 3.16 6.04l2.11 3.72z"/>
          <path fill="#34A853" d="M16.04 17.8A7.06 7.06 0 0 1 12 19.1c-2.93 0-5.44-1.78-6.65-4.36l-3.7 2.86A11.95 11.95 0 0 0 12 23c3.24 0 6.29-1.26 8.55-3.37l-4.51-1.83z"/>
          <path fill="#FBBC05" d="M5.35 14.74A7.17 7.17 0 0 1 4.9 12c0-.95.17-1.87.45-2.74L3.16 5.54A11.95 11.95 0 0 0 1 12c0 1.96.47 3.8 1.32 5.42l3.03-2.68z"/>
          <path fill="#4285F4" d="M23 12c0-.65-.06-1.28-.17-1.9H12v3.9h6.18a5.27 5.27 0 0 1-2.14 3.4l4.51 1.83A12 12 0 0 0 23 12z"/>
        </svg>
      </button>

      
      <button class="social__btn" aria-label="Entrar com Facebook">
        <svg viewBox="0 0 24 24" fill="#1877F2">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      </button>

    </div>

    
    <p class="footer">Já tem uma conta? <a href="/html/Entrar.html">Entrar</a> <a href="/html/ParaEmpresas.html" class="btn-empresas-small">Para Empresas</a></p>
    <p class="footer">Você é um confeiteiro? <a href="/html/Cadastroconfeiteiro.html" class="btn-empresas-small">Cadastre sua Empresa</a></p>

  </div>
 <script src="/js/Cadastro.js"></script>
</body>
</html>
